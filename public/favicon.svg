<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="luciferGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Dark Rounded Hexagon -->
  <rect width="64" height="64" rx="14" fill="#080a0f" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#luciferGlow)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Cybernetic Lucifer Sigil / Geometric Tridents -->
  <g filter="url(#neonBlur)">
    <!-- Central Beam -->
    <path d="M32 10 L32 54" stroke="url(#luciferGlow)" stroke-width="3" stroke-linecap="round" />
    <!-- Left Wing / Blade -->
    <path d="M16 22 L24 38 L32 30" stroke="#ff2a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Wing / Blade -->
    <path d="M48 22 L40 38 L32 30" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Core Diamond Nexus -->
    <polygon points="32,24 36,30 32,36 28,30" fill="#ffffff" />
    <!-- Bottom Anchor Crown -->
    <path d="M22 46 L32 54 L42 46" stroke="url(#luciferGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>